<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password · Projexify</title>
  <link rel="stylesheet" href="/assets/css/design-system.css">
  <link rel="stylesheet" href="/assets/css/style.css">
  <style>
    body { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
    .reset-card { width: min(100%, 440px); padding: 32px; border-radius: 20px; background: rgba(17,24,39,.88); border: 1px solid rgba(255,255,255,.1); box-shadow: 0 20px 60px rgba(0,0,0,.25); }
    .reset-card h1 { margin-bottom: 8px; }
    .reset-card p { color: var(--text-muted); margin-bottom: 24px; }
    .form-group { margin-bottom: 16px; }
    .form-group label { display:block; margin-bottom:8px; font-weight:600; }
    .form-input { width:100%; }
    .status { margin-top:16px; min-height:24px; font-size:.95rem; }
    .status.error { color:#f87171; }
    .status.success { color:#34d399; }
  </style>
</head>
<body>
  <main class="reset-card">
    <h1>Reset your password</h1>
    <p>Choose a new password with at least 8 characters.</p>
    <form id="resetForm">
      <div class="form-group">
        <label for="password">New password</label>
        <input class="form-input" id="password" type="password" minlength="8" autocomplete="new-password" required>
      </div>
      <div class="form-group">
        <label for="confirmPassword">Confirm password</label>
        <input class="form-input" id="confirmPassword" type="password" minlength="8" autocomplete="new-password" required>
      </div>
      <button class="btn btn-primary" id="submitBtn" type="submit" style="width:100%">Update password</button>
      <div class="status" id="status" role="status"></div>
    </form>
  </main>

  <script src="/assets/js/api-client.js"></script>
  <script>
    const token = new URLSearchParams(window.location.search).get('token');
    const form = document.getElementById('resetForm');
    const statusEl = document.getElementById('status');
    const submitBtn = document.getElementById('submitBtn');

    if (!token) {
      statusEl.textContent = 'This reset link is invalid.';
      statusEl.className = 'status error';
      submitBtn.disabled = true;
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      if (password.length < 8) {
        statusEl.textContent = 'Password must be at least 8 characters.';
        statusEl.className = 'status error';
        return;
      }
      if (password !== confirmPassword) {
        statusEl.textContent = 'Passwords do not match.';
        statusEl.className = 'status error';
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Updating…';
      try {
        const result = await window.api.resetPassword(token, password);
        statusEl.textContent = result.message || 'Password updated successfully.';
        statusEl.className = 'status success';
        setTimeout(() => { window.location.href = '/login.html'; }, 1200);
      } catch (error) {
        statusEl.textContent = error.message || 'Could not reset password.';
        statusEl.className = 'status error';
        submitBtn.disabled = false;
        submitBtn.textContent = 'Update password';
      }
    });
  </script>
</body>
</html>
